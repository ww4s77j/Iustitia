org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

# Tooling. Per-version Minecraft/dependency coordinates live in
# stonecutter.properties.toml; the version list lives in versions.json.
kotlin_version=2.3.10
# One Loom version for every node; loom-back-compat routes each version
# subproject to the right flavour (remap vs unobfuscated).
loom_version=1.18.4

systemProp.http.proxyHost=
systemProp.https.proxyHost=
